openapi: 3.1.0
info:
  title: Legiit Command Center API for Legiit Lens
  version: 1.0.0-draft.4
  summary: The API the Legiit Lens Chrome extension calls. To be built by the Legiit backend team.
  description: |
    The extension is finished and calls exactly this API. The API does not exist yet.
    Read README.md first: it tells you what to build, in which order, and how to test it.
    The changes from one version of this file to the next are listed in README.md, section
    "Version and changes".

    This file decides field names, types and limits: if two files of the kit disagree, this
    file is right. reference.md, openapi.examples.json and the files in schemas/ are generated
    from it. The mock server and the conformance check read it when they run.

    Rules for every request (they are not repeated per endpoint)
    - Every request carries `Authorization: Bearer <token>`, `Accept: application/json` and
      `X-Legiit-Client: legiit-lens/<version>`. A POST also carries `Content-Type: application/json`.
      No cookies are sent. X-Legiit-Client is for your logs: do not require it.
    - Only GET and POST are used. There are no query strings.
    - A request body is one JSON object in UTF-8 of at most 1,048,576 bytes. Accept that much.
    - Answer in JSON, on the URL that was called. The extension never follows a redirect.
    - Send `Cache-Control: no-store` with every reply, so that no proxy and no cache keeps a
      copy of a user's data.
    - The extension waits 20 seconds for a reply, 60 seconds for POST /v1/ai/completions,
      and never retries by itself.

    Conventions used in this file
    - This is OpenAPI 3.1: every schema is JSON Schema 2020-12, and a type can be a list such
      as [string, 'null']. Use tools that read OpenAPI 3.1.
    - Request schemas describe exactly what the extension sends. Every required field is in
      every request. A field with no value is sent as null, "" or [], as its description says;
      these are valid values. One field can be absent: responseSchema of the AI request.
    - Reply schemas describe what you must return. The extension ignores fields it
      does not know, so you may add fields.
    - Ignore request fields you do not know: a later extension version may add fields.
    - enum is a closed list. x-values lists the values this version uses for a field that a
      later version may extend: store such a value as text and accept one you do not know.
    - Sentences such as "null exactly when…" or "always the number of…" describe what the
      extension sends. You can rely on them; do not reject a request because of them.
    - Text lengths are counted in UTF-16 code units (the "length" of a JavaScript
      string). A text within its limit in that count is also within it counted in
      characters, so a check that counts characters (not bytes) never refuses a valid request.
    - A value over its limit is shortened by the extension, not refused: text is cut and ends with "…",
      a list keeps its first entries, a URL is cut at 2,048 characters. So a value at exactly its
      maximum can be a shortened copy.
    - Every integer in a request fits a signed 32-bit column.
    - x-uses, in a response schema, is how much of a value the extension uses. More is
      allowed and is cut by the extension.
    - x-examples: some values that a field can have. It is not a list of allowed values.
    - x-capability: the capability the extension needs before it shows this feature.
    - x-called-when: what the user does that causes the call.
    - x-extension-reaction: what the extension does with that reply.
servers:
  - url: https://api.legiit.com
    description: Production. This host is assumed. It must be confirmed before the extension is submitted to the Chrome Web Store.
  - url: http://localhost:8787
    description: The mock server in this repository (npm run mock).
security:
  - bearerToken: []
tags:
  - name: Account
  - name: Businesses
  - name: Saves
  - name: Insights
  - name: AI
paths:
  /v1/session:
    get:
      operationId: getSession
      tags: [Account]
      summary: Checks the token. Returns who is connected and which features are switched on.
      description: |
        This is the first call the extension makes, and the call that decides whether the extension
        is connected. Make it fast, and do not give it a strict rate limit: it runs every time the
        user opens the side panel.

        For a valid token answer 200, and say what the user's plan includes through `capabilities`,
        never through 403. Answer 403 here only when the account may not use the API at all (it is
        suspended, for example): the extension then shows your message and "Legiit not connected", and
        keeps a token that is already stored (at Connect nothing is stored). Answer 401 only when the
        token itself is not valid, and with the error body: that 401 makes the extension delete the token.

        The extension shows a feature only when its capability is in `capabilities`. With an empty list
        the user is connected and sees no Legiit feature at all.

        If this call fails for another reason (a 5xx, a timeout), the extension keeps the token, shows
        "Legiit not connected" with the reason, and offers "Try again". Until this call succeeds, the
        extension calls no other endpoint.
      x-called-when: >-
        The user clicks Connect or "Try again". After that, once each time the side panel or the
        settings page opens while a token is stored, and again in every open extension page when the
        stored token changes.
      responses:
        '200':
          description: The token is valid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Unavailable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '5XX': { $ref: '#/components/responses/ServerError' }
  /v1/businesses:
    get:
      operationId: listBusinesses
      tags: [Businesses]
      summary: Lists the businesses the user can save into.
      description: |
        Return the businesses this user may save into (their own and those shared with them) in one
        reply. A business the user can see but not save into does not belong in this list. There is
        no paging: the extension shows the first 500, in the order you return them, in a drop-down
        under Settings. Any stable order is fine; by name is a good default. With more than 500,
        return only the 500 the user worked with most recently, by a measure that you choose (last
        opened or last saved into). Keep the reply under 5 MB: the extension does not read a larger one.
      x-capability: businesses
      x-called-when: Each time the settings screen is shown while connected (the settings page, or the Settings tab of the side panel).
      responses:
        '200':
          description: The businesses. An empty list is fine; the extension then tells the user to add one in Command Center.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusinessList' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Unavailable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '5XX': { $ref: '#/components/responses/ServerError' }
  /v1/businesses/{businessId}:
    get:
      operationId: getBusinessDetails
      tags: [Businesses]
      summary: Returns one business with its brand names, domains and competitors.
      description: |
        The extension copies these values once, into the user's tracked brands on their device. It does
        not ask again until the user chooses the business again. Until then it does not see a later
        change in Command Center. Disconnecting removes the copies.

        The copy is a merge. Brands the user typed themselves are kept and have priority: a competitor
        with the same name or domain as one of them is not added again. The device holds at most 50 own
        brands and 200 competitors.

        When this call fails the extension shows the reason under the drop-down and keeps what it had.
      x-capability: businesses
      x-called-when: The user chooses a business in the drop-down under Settings.
      parameters:
        - $ref: '#/components/parameters/BusinessId'
      responses:
        '200':
          description: The business.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusinessDetails' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '5XX': { $ref: '#/components/responses/ServerError' }
  /v1/businesses/{businessId}/visibility-snapshots:
    post:
      operationId: saveVisibilitySnapshot
      tags: [Saves]
      summary: Saves one measured Google results page for a business.
      description: |
        A snapshot records how one Google results page looked in the user's browser: where the organic
        results start, what fills the first screen, and where the tracked brands rank.

        Store every snapshot as a new item: it is one point in time for the keyword. Do not merge
        snapshots that are similar, and do not discard one. The same measurement can arrive twice (the
        user saved it twice); it then carries the same `capturedAt`.
      x-capability: visibilitySnapshots
      x-called-when: The user clicks "Save to Command Center" on the Click Potential tab, reads the JSON and confirms.
      parameters:
        - $ref: '#/components/parameters/BusinessId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VisibilitySnapshot' }
      responses:
        '201': { $ref: '#/components/responses/Saved' }
        '200': { $ref: '#/components/responses/Saved' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '5XX': { $ref: '#/components/responses/ServerError' }
  /v1/businesses/{businessId}/gap-lists:
    post:
      operationId: saveGapList
      tags: [Saves]
      summary: Saves a list of places where competitors appear and the business does not.
      description: |
        A gap list comes from one Google results page or one AI answer (ChatGPT, Gemini, Perplexity,
        Copilot, Google AI Mode, or text the user pasted). Each row is one place where a tracked
        competitor is present and the user's own brand is absent.

        Store every gap list as a new list. The same reading can be saved twice with different rows:
        first as read, then again after the user ran "Scan sources", which adds contact details to rows.
        Both carry the same `capturedAt`.
      x-capability: gapLists
      x-called-when: The user clicks "Save to Command Center" on the Why Not Me tab, reads the JSON and confirms.
      parameters:
        - $ref: '#/components/parameters/BusinessId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GapList' }
      responses:
        '201': { $ref: '#/components/responses/Saved' }
        '200': { $ref: '#/components/responses/Saved' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '5XX': { $ref: '#/components/responses/ServerError' }
  /v1/businesses/{businessId}/competitors:
    post:
      operationId: addCompetitor
      tags: [Saves]
      summary: Adds a competitor to a business.
      description: |
        The user typed this competitor into the extension's settings and wants it in Command Center too.

        Recommended: never store the same competitor twice. Compare names case-insensitively, and
        ignore spaces at both ends. Compare domains as hosts: lower case,
        without scheme, "www." and path; a subdomain is a different domain.

        When the business already has a competitor with this name or one of these domains, answer 200
        with the id of that competitor, and add the domains it did not have yet. A name match has
        priority over a domain match. When no name matches, go through the domains of the request in
        their order: the first domain that a competitor of the business already has decides, and you
        return that competitor. A domain that another competitor of the business already has is not
        added: it stays with that competitor. Do not answer 409 for a
        competitor that already exists.

        After a save, GET /v1/businesses/{businessId} lists the competitor.
      x-capability: competitors
      x-called-when: The user clicks "Add to Command Center" next to a competitor in Settings, reads the JSON and confirms.
      parameters:
        - $ref: '#/components/parameters/BusinessId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Competitor' }
      responses:
        '201': { $ref: '#/components/responses/Saved' }
        '200': { $ref: '#/components/responses/Saved' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '5XX': { $ref: '#/components/responses/ServerError' }
  /v1/businesses/{businessId}/content-editor/documents:
    post:
      operationId: sendToContentEditor
      tags: [Saves]
      summary: Sends a content analysis of one page to the content editor.
      description: |
        The extension compared one text, sentence by sentence, with competing pages. The body says which
        of its sentences nobody else makes (worth keeping) and which points most competitors make that
        it lacks (worth adding). The text itself is not sent.

        What the content editor does with this is Legiit's decision (README, "Decisions"). Until
        Legiit decides, build this: store the body as a new item of the business and show it as a note
        with two lists, "Only on this page" and "Missing points" with their source links. Store every
        analysis as a new item; the same analysis sent again carries the same `capturedAt`.
      x-capability: contentEditor
      x-called-when: The user clicks "Send to content editor" on the New or Noise tab, reads the JSON and confirms.
      parameters:
        - $ref: '#/components/parameters/BusinessId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentEditorDocument' }
      responses:
        '201': { $ref: '#/components/responses/Saved' }
        '200': { $ref: '#/components/responses/Saved' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '5XX': { $ref: '#/components/responses/ServerError' }
  /v1/workspaces/from-brief:
    post:
      operationId: createWorkspaceFromBrief
      tags: [Saves]
      summary: Creates a workspace for a new client from a brief the extension wrote.
      description: |
        The extension read a prospect's website and wrote a client brief: what the business is, what it
        offers, where, who its competitors are, and what is wrong with the site.

        This is the only save that does not go into an existing business, so the path has no business
        id. What a workspace is in Command Center is Legiit's decision (README, "Decisions"). The
        extension needs only `id` and `url` back; it does not expect the workspace in GET
        /v1/businesses. Until Legiit decides, build this: store the body as a brief of the user, and
        return the URL of a page that shows its `markdown`.

        Recommended: one workspace per brief. `briefId` identifies the brief; look it up per user, never
        across users. The first request with a briefId creates the workspace (201). A later one is the
        same brief sent again, perhaps with other competitors: replace the stored brief with the new
        body and answer 200 with the same id and url.

        Return a `url`: the button that starts this save is labelled "Open in Command Center", so the
        user expects a link into the new workspace.

        Everything in the body was read from a public website by a program. Treat the values as
        suggestions the user will review, not as verified facts.
      x-capability: workspaces
      x-called-when: The user clicks "Open in Command Center" on the Instant Brief tab, reads the JSON and confirms.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceFromBrief' }
      responses:
        '201': { $ref: '#/components/responses/Saved' }
        '200': { $ref: '#/components/responses/Saved' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Unavailable' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '5XX': { $ref: '#/components/responses/ServerError' }
  /v1/industry-pulse:
    get:
      operationId: getIndustryPulse
      tags: [Insights]
      summary: Returns dated search-industry events, such as Google algorithm updates.
      description: |
        The Rewind tab shows how a page changed over time. It offers the dates of the first eight events
        as shortcuts: one click filters the page history to the days before that date (30 by default;
        the user can change the number). Only `date` and `title` are shown, and only once the user has
        looked up the history of a page.

        The data is the same for every user, so you can cache the reply on your server. Return only
        the latest events: 8 are shown, so 20 are enough.

        When this call fails, for any reason, the extension shows no shortcuts and no message.
      x-capability: industryPulse
      x-called-when: Each time the Rewind tab is opened while connected.
      responses:
        '200':
          description: The events, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IndustryPulse' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Unavailable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '5XX': { $ref: '#/components/responses/ServerError' }
  /v1/ai/completions:
    post:
      operationId: completeAI
      tags: [AI]
      summary: Rewrites a summary with Legiit's language model.
      description: |
        Four tabs of the extension show a summary built without AI, and the Instant Brief tab shows
        draft customer avatars. With this capability the user can ask for them to be rewritten. The
        extension sends the complete instructions (`system`) and the facts (`prompt`); you pass them
        to a language model and return its text. Nothing has to be stored, and there is no
        Idempotency-Key.

        Two kinds of request:

        1. A summary (no `responseSchema`; `task` is not "brief"). Return plain text: 3 to 6 short
           lines, one point per line. Required: `text` is a non-empty string. The rest is what the
           prompt asks of the model: the extension shows the first 8 lines as bullet points, removes a
           leading "- " or "1." and Markdown emphasis marks, leaves out an introduction line that
           ends with ":", and cuts a line at 600 characters.
        2. A brief (`task` is "brief", with `responseSchema`). Return in `text` one JSON document that
           matches that JSON Schema, as a string, with nothing before or after it (see
           examples/completeAI.brief.response.json). Pass the schema to your model's structured-output
           option if it has one. The extension uses the reply when it has three avatars with a name,
           "who", "wants" and "worries", and at least one next step. It keeps up to 80 characters of a
           name, 400 of every other text, 6 searches of 120 characters and 8 next steps; longer text is
           cut, so ask the model for short entries. Check that the model's output parses as JSON
           before you return it (you need not check it against the schema). If it does not parse,
           ask the model once more. If the second output does not parse either, answer 502.

        If the model returns no text at all, also ask once more. If there is still no text,
        answer 502. Both tries together must end before the extension stops waiting (60 seconds):
        give each call to the model a time limit of about 25 seconds.

        `maxOutputTokens` is the largest size of the visible reply. The extension sends 700 for a
        summary and 2,000 for a brief. If your model uses tokens for reasoning, give it more than
        this. If the number is above your own maximum, use your maximum; do not refuse the request
        for it.

        The reply is not streamed: answer with one JSON body within 60 seconds. If the model provider
        is slow or not available, answer 504 or 503 before that. If the user's AI allowance is used
        up, answer 429 with a message that says when to try again.

        When this call fails, for any reason, the extension keeps its own text and shows one line
        with the reason. After a 404, 405 or 501 it stops offering the button until the page is
        reopened or the user connects again.

        Security: `system` and `prompt` come from the client, so anyone with a token can send their
        own: limit use per user and enforce the length limits below. The facts between `<facts>` and
        `</facts>` were read from web pages and can contain text that tries to instruct the model. Give
        the model no tools and no access to other data.
      x-capability: ai
      x-called-when: >-
        The user clicks "Rewrite with Legiit AI" on the Click Potential, Why Not Me, Rewind or New or
        Noise tab, or "Improve drafts with Legiit AI" on the Instant Brief tab (task "brief"), reads
        the JSON and confirms.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiCompletionRequest' }
      responses:
        '200':
          description: The text the model wrote.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiCompletionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Unavailable' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '5XX': { $ref: '#/components/responses/ServerError' }
components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      description: >-
        An API token that the user creates in Command Center and pastes into the extension. The
        extension does not read what is in it. It is sent in an HTTP header: printable ASCII without
        spaces, at most 4,096 characters (the extension refuses to store anything else). The word
        "Bearer" is case-insensitive: accept "bearer" too.
  # A parameter or a response that several endpoints share is printed once in reference.md, under
  # "Shared parameters and responses". Each endpoint prints only the first paragraph of its
  # description, with a link. So write a first paragraph that can be read alone.
  parameters:
    BusinessId:
      name: businessId
      in: path
      required: true
      description: |
        The `id` of a business from GET /v1/businesses, percent-encoded (an integer id arrives as its digits).

        Prefer ids made of letters, digits, "-" and "_": a "/" in an id arrives as %2F, which some
        servers and proxies refuse. An id that cannot exist in your scheme (text where you use
        numbers) is best answered like an unknown business, 404 with the code "not_found"; it must
        never cause a 5xx.
      schema: { type: string, minLength: 1, maxLength: 120 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        A random UUID that identifies one save the user confirmed. Do not require the header and do not check its format.

        The extension sends it on every save, and repeats it when the user sends the same save again
        from the same dialog, which happens after a timeout and also after an error.

        Recommended: remember the reply of a successful save under (user, method, path, key) for 24
        hours, and answer the same key with that reply again (same status, same body) without storing
        anything. Check the token, the capability and the business first; a remembered reply is given
        instead of validating and storing the body. Never remember an error. Do not compare bodies.

        If the first request with a key is still running, wait for it or answer 409 (the extension
        shows a 409 like any other 4xx). If you mark a key as running, let the mark end by itself after
        about 30 seconds. A request that died must not block the key for 24 hours.

        curl and the conformance check send saves without the header. An empty value means "no key".
        The extension sends a UUID (36 characters). A key longer than 255 characters may be treated as
        no key. You may store a hash of the key in place of the key.
      schema: { type: string, maxLength: 255 }
  responses:
    Saved:
      description: |
        The item was stored (201), or it already existed and its id is returned (200). The body is required, with `id` at the top level.

        A 204, an empty body, or a body wrapped in another object (such as "data") is treated as a
        failed save, and the user is likely to send it again.
      x-extension-reaction: Closes the dialog and shows "Saved", with an "Open in Command Center" link when `url` is present.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SaveResult' }
    BadRequest:
      description: The body is not JSON, or not a JSON object. Treated like a 422.
      x-extension-reaction: The same as for 422.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorised:
      description: >-
        The token is missing, unknown, expired or revoked. Use 401 for nothing else, always with the
        error body, and make sure nothing in front of the API (a gateway, a proxy, HTTP Basic auth on a
        staging site) answers 401 for a valid token.
      x-extension-reaction: >-
        On GET /v1/session, when the 401 carries the error body: deletes the stored token and asks the
        user to paste a new one. A 401 without the error body keeps the token and offers "Try again".
        On any other request: shows "Legiit did not accept the token". Your `error.message` is not shown.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: >-
        The token is valid and the user has the feature, but another rule of yours refuses this one
        request: the user's role in this business does not allow this kind of save, or the account may
        not use the API (it is suspended, for example). Name the reason in `error.message`. Not for a
        feature the user does not have: leave its capability out of the session, and answer a call to
        it with 404. Not for a business that the user may not save into at all: that is 404
        "not_found". Not for an allowance that is used up: that is 429.
      x-extension-reaction: >-
        Shows "Legiit rejected the request (403)" followed by your `error.message`. A token that is
        already stored is kept. During Connect nothing is stored when the session check fails, for any
        reason.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: >-
        Only on a path with a business id: the business in the path does not exist or is not this
        user's. Answer 404 with the error body and `error.code` "not_found". The code is required for
        this case and reserved for it. A 404 with any other code, or without the error body, has
        another meaning: the endpoint is not available.
      x-extension-reaction: >-
        Shows "Legiit could not find it (404)" followed by your `error.message`. The feature stays.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unavailable:
      description: >-
        The endpoint is not built, or its capability is not enabled for this user. Answer 404, 405 or
        501, with any body or none: the three statuses mean the same to the extension. If you send the
        error body, use any code except "not_found": that code is reserved for a missing business.
      x-extension-reaction: >-
        A save: says "Legiit cannot receive this yet", then hides that button in that page until the
        page is opened again or the user reconnects. The business list: hides the drop-down. One
        business (GET /v1/businesses/{businessId}): shows a message and hides nothing. Industry
        pulse: shows no date shortcuts. AI: keeps the built-in text, says why, and stops offering the
        button. The session check: shows "The Legiit API is not available yet".
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: >-
        Only for one case: the first request with the same Idempotency-Key is still running, and you
        do not wait for it. Say in `error.message` that the save is still running and when to send it
        again. Never for a competitor or a workspace that already exists: answer 200 with its id.
      x-extension-reaction: The same as for 422.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooLarge:
      description: >-
        The body is larger than you accept. The extension never sends more than 1,048,576 bytes, so
        accept that much. A proxy in front of your application can answer 413 by itself, with its own
        page and not the error body (nginx sends HTML). That is acceptable: no request of the
        extension is that large.
      x-extension-reaction: The same as for 422.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Invalid:
      description: >-
        The body was understood but cannot be accepted. Say what is wrong in `error.message`, in words
        a user can act on. Any 4xx status that is not listed here is treated the same way.
      x-extension-reaction: >-
        A save: keeps the dialog open and shows "Legiit rejected the request (422)" followed by your
        `error.message`; the user can send again. AI: keeps the built-in text and shows the same sentence
        as the reason.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: >-
        The user sent too many requests, or the user's daily AI allowance is used up.
        The extension does not read Retry-After, so say in `error.message` when to try again.
      x-extension-reaction: Shows "Legiit rejected the request (429)" followed by your `error.message`. Never retries by itself.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServerError:
      description: >-
        Something failed on your side: every 5xx except 501, which is read as "this endpoint is not
        built". A body is optional and is not shown.
      x-extension-reaction: Shows "Legiit had a problem" with the status code. Never retries by itself; the user can click again.
  schemas:
    Error:
      type: object
      description: >-
        The JSON body of every 4xx reply, including the ones your framework produces by itself
        (validation, throttling, authorisation, a missing record, a body that is too large). Two
        exceptions: a 404 or 405 that means "this endpoint is not available" can have any body or
        none, and a 413 that a proxy sends by itself can be the proxy's own page.
      required: [error]
      properties:
        error:
          type: object
          description: The one top-level key of an error reply.
          required: [code, message]
          properties:
            code:
              type: string
              description: >-
                A short machine-readable reason. The extension reads exactly one value: "not_found" on a
                404 of a path with a business id means "this business does not exist". That value is
                reserved for that case. Use your own values for everything else.
              x-examples: [bad_request, unauthorised, forbidden, not_found, not_available, conflict, too_large, invalid, rate_limited]
            message:
              type: string
              minLength: 1
              description: >-
                One plain sentence for the user, without HTML: what is wrong and, if you know it,
                what the user can do. Shown after the status code for a 404 "not_found" and for every
                other 4xx except 401; not shown for 401, for a 404, 405 or 501 that means "not available",
                or for a 5xx. A message over 200 characters is cut and ends with "…".
              x-uses: { chars: 200 }
    Id:
      type: [string, integer]
      minLength: 1
      maxLength: 120
      pattern: '\S'
      minimum: 0
      maximum: 9007199254740991
      description: >-
        An identifier: a string of 1 to 120 characters, or a non-negative integer of at most 2^53 - 1,
        whichever your database uses. Send a larger integer as a string. The extension does not
        interpret an id: it sends it back as it came (an integer as its digits; spaces around a string id
        are removed). Return the same business with the same id everywhere. An id is never cut: a
        business whose id cannot be read is skipped, and a user id or a save id that cannot be read
        makes the whole reply unusable. A string id is valid Unicode with at least one character
        that is not white space. Do not use "." or ".." as an id.
    Capability:
      type: string
      maxLength: 60
      x-values: [businesses, visibilitySnapshots, gapLists, competitors, contentEditor, workspaces, industryPulse, ai]
      description: >-
        One feature the extension can show. businesses: the business drop-down; list it whenever you
        list visibilitySnapshots, gapLists, competitors or contentEditor, because those saves go into a
        chosen business. visibilitySnapshots, gapLists, competitors, contentEditor, workspaces: one save
        button each. industryPulse: date shortcuts on the Rewind tab. ai: the two "… with Legiit AI"
        buttons. Names are case-sensitive.
    Session:
      type: object
      required: [user, capabilities]
      properties:
        user:
          type: object
          description: The person the token belongs to.
          required: [id]
          properties:
            id:
              $ref: '#/components/schemas/Id'
              description: >-
                Stable id of the user. Not shown. When the extension sees another user id than before, it
                forgets the business that was chosen.
            name:
              type: [string, 'null']
              description: Display name, shown after "Connected". When it is null or empty the e-mail is shown instead.
              x-uses: { chars: 200 }
            email:
              type: [string, 'null']
              description: Shown only when there is no name.
              x-uses: { chars: 320 }
        plan:
          type: [string, 'null']
          description: Name of the user's plan, as text to show next to the name. Not used for any decision.
          x-uses: { chars: 80 }
          x-examples: [agency]
        capabilities:
          type: array
          description: >-
            The features this user may use, as a JSON array of names; every token of the user gets the
            same list. The extension shows a feature only when its capability is listed. Names are
            case-sensitive: a name the extension does not know, or a misspelt one, is ignored without an
            error. To launch endpoint by endpoint, list only the capabilities whose endpoints are ready.
          items: { $ref: '#/components/schemas/Capability' }
    Business:
      type: object
      required: [id, name]
      properties:
        id:
          $ref: '#/components/schemas/Id'
          description: Used as {businessId} in every path below a business. Unique in the list.
        name:
          type: string
          description: Shown in the drop-down.
          x-uses: { chars: 200 }
        domain:
          type: [string, 'null']
          description: The main domain. Shown only when the name is empty.
          x-uses: { chars: 255 }
    BusinessList:
      type: object
      required: [businesses]
      properties:
        businesses:
          type: array
          description: The businesses the user may save into, in the order to show them. A JSON array, also when it is empty.
          x-uses: { items: 500 }
          items: { $ref: '#/components/schemas/Business' }
    BusinessDetails:
      type: object
      description: >-
        What the extension pre-fills as "tracked brands". The extension uses brands to separate the
        user's own results from the results of competitors on a Google page: by domain for links, by
        name for text.
      required: [id, name]
      properties:
        id:
          $ref: '#/components/schemas/Id'
          description: The same id as in the path, in the same form as GET /v1/businesses lists it.
        name:
          type: string
          description: Name of the business. Becomes the name of the user's own tracked brand (its first 160 characters).
          x-uses: { chars: 200 }
        brandNames:
          type: [array, 'null']
          description: >-
            Other ways people write the business's name ("BrightPath", "Bright Path Dental"). Used to
            find the brand in AI answers and page text. The name itself may be repeated here; that is
            not a problem. Absent or null means none.
          x-uses: { items: 30 }
          items: { type: string, x-uses: { chars: 160 } }
        domains:
          type: [array, 'null']
          description: >-
            Domains the business owns, one per entry. A result on one of them counts as the user's own.
            "example.com", "www.example.com" and "https://www.example.com/page" are all read as
            example.com: the path is removed, and subdomains of a listed domain count too. So do not list
            a profile on a shared site (facebook.com/yourbusiness, a marketplace listing): every result on
            that whole site would count as the business. Values that are not a domain (an e-mail address,
            a wildcard) are skipped.
          x-uses: { items: 30 }
          items: { type: string, x-uses: { chars: 255 } }
        competitors:
          type: [array, 'null']
          description: The business's competitors. Each becomes a tracked competitor, unless the user already tracks one with that name or domain.
          x-uses: { items: 200 }
          items:
            type: object
            required: [name]
            properties:
              name:
                type: string
                description: Display name. A competitor with an empty name is tracked under its first domain.
                x-uses: { chars: 160 }
              domains:
                type: [array, 'null']
                description: Domains of the competitor, read the same way as the business's own domains.
                x-uses: { items: 30 }
                items: { type: string, x-uses: { chars: 255 } }
        focusKeywords:
          type: [array, 'null']
          description: Keywords the business wants to rank for. Shown as a line of text under Settings; nothing else uses them yet.
          x-uses: { items: 200 }
          items: { type: string, x-uses: { chars: 200 } }
        avatars:
          type: [array, 'null']
          description: Customer avatars of the business. Stored on the device for a later version; not shown yet. You can leave it out.
          x-uses: { items: 20 }
          items:
            type: object
            required: [name]
            properties:
              name: { type: string, description: Short label of the avatar., x-uses: { chars: 160 } }
              description: { type: [string, 'null'], description: Who this customer is., x-uses: { chars: 2000 } }
    SaveResult:
      type: object
      required: [id]
      properties:
        id:
          $ref: '#/components/schemas/Id'
          description: Id of the stored item, at the top level of the body. Not shown to the user.
        url:
          type: [string, 'null']
          maxLength: 2048
          pattern: '^https?://'
          description: >-
            Absolute URL, without spaces, of a page in Command Center that shows the stored item:
            https in production (http is accepted for a local test system). Never a relative path. The
            extension shows it as an "Open in Command Center" link next to "Saved"; a click opens it in a
            new tab without the token, so the page must work with the user's normal Command Center login.
            Send null until that page exists. When `url` is null, absent, longer than 2,048 characters,
            or not a URL that can be opened (a relative path, no scheme), "Saved" is shown without a link.
    HttpUrl:
      type: string
      maxLength: 2048
      pattern: '^https?://'
      description: >-
        An absolute http or https URL, written the way the browser writes it. It can contain characters
        that strict URI validators reject (for example [ ] and | in a query string): check the scheme and
        the length, nothing more.
    Fold:
      type: [string, 'null']
      enum: [above, partly, below, null]
      description: >-
        Where a result is, relative to the fold. The fold is the bottom edge of the first screen (y = viewport.height).
        above: the result ends at or above the fold. partly: the fold cuts through it. below: it starts at or
        below the fold. null: it could not be measured.
    VisibilitySnapshot:
      type: object
      description: >-
        One measurement of one Google results page, exactly as the user's Chrome displayed it (their window size,
        location and personalisation). Pixel values are CSS pixels from the top of the document, so they do not
        depend on how far the user had scrolled.
      required: [keyword, capturedAt, googleHost, mode, resultsOffset, viewport, location, firstOrganicTopPx, firstOrganicFold, organicShare, grade, firstScreenShares, organic, tracked]
      properties:
        keyword:
          type: string
          minLength: 1
          maxLength: 500
          description: The search query as typed (the q parameter of the page), with whitespace collapsed.
        capturedAt:
          type: string
          format: date-time
          description: >-
            When the page was measured, on the user's clock, as UTC with milliseconds (2026-11-20T12:00:00.000Z).
            It is not the time of the save. It can be a little later than the time on your server, and it
            is the same when the user saves the same measurement twice.
        googleHost:
          type: string
          maxLength: 40
          pattern: '^www\.google\.[a-z.]+$'
          description: Host of the results page. Always starts with "www.google." and can be a country site.
          x-examples: [www.google.com, www.google.co.uk]
        mode:
          type: string
          maxLength: 40
          x-values: [web]
          description: Kind of results page. Always "web" in this version; AI Mode pages are not saved.
        resultsOffset:
          type: integer
          minimum: 0
          maximum: 1000
          description: >-
            How many results come before this page (Google's start parameter): 0 on the first results page,
            10 on the second. Positions in this body are relative to the page; add this number for an
            approximate absolute rank.
        viewport:
          type: object
          description: Size of the page area of the browser window when the page was measured, in CSS pixels.
          required: [width, height]
          properties:
            width: { type: integer, minimum: 1, maximum: 100000, description: Width of the first screen. }
            height: { type: integer, minimum: 1, maximum: 100000, description: Height of the first screen. This is the fold. }
        location:
          type: [string, 'null']
          maxLength: 160
          description: >-
            The place name Google printed on the page (for example "Austin, Texas"), in the language of
            Google's interface. null when the page shows none.
        firstOrganicTopPx:
          type: [integer, 'null']
          minimum: 0
          maximum: 10000000
          description: Top edge of the topmost organic result. null when no organic result could be measured.
        firstOrganicFold:
          $ref: '#/components/schemas/Fold'
          description: >-
            Where the topmost organic result is, relative to the fold (the bottom edge of the first screen,
            y = viewport.height). above: it ends at or above the fold. partly: the fold cuts through it.
            below: it starts at or below the fold. null exactly when firstOrganicTopPx is null.
        organicShare:
          type: number
          minimum: 0
          maximum: 1
          description: >-
            Part of the first screen covered by organic results (0.25 means 25 %), rounded to 4 decimals.
            Equal to the "organic" entry of firstScreenShares, or 0 when there is none.
        grade:
          type: object
          description: >-
            The extension's "organic click potential" for this page. It is a layout score, not a measured
            click-through rate.
          required: [letter, score, estimate]
          properties:
            letter:
              type: string
              enum: [A, B, C, D, F]
              description: 'The letter for the score: A is 85 to 100, B 70 to 84, C 50 to 69, D 30 to 49, F 0 to 29.'
            score:
              type: integer
              minimum: 0
              maximum: 100
              description: >-
                100, minus up to 60 points for how far down the first screen the first organic result starts,
                minus up to 40 points for the part of the first screen's result area that is not organic.
            estimate:
              type: boolean
              const: true
              description: Always true. Label the grade as an estimate wherever it is shown.
        firstScreenShares:
          type: array
          maxItems: 12
          description: >-
            What fills the first screen: one entry per kind of result that is visible there, largest first.
            A kind that is missing covers nothing. Kinds are measured separately, so the shares can overlap
            and need not add up to 1.
          items:
            type: object
            required: [type, share]
            properties:
              type:
                type: string
                maxLength: 40
                x-values: [organic, ai_overview, ad, local_pack, featured_snippet, paa, video, image, shopping, forum, top_stories, knowledge_panel]
                description: >-
                  Kind of result. paa is "People also ask", forum is "Discussions and forums", top_stories is the
                  news block.
              share:
                type: number
                minimum: 0
                maximum: 1
                description: Part of the first screen this kind covers, rounded to 4 decimals. A very small part can round to 0.
        organic:
          type: array
          maxItems: 100
          description: >-
            The organic results of this page, in page order. Links inside other blocks (featured snippet,
            People also ask, videos) are not organic results. The array can be empty.
          items:
            type: object
            required: [position, url, domain, title, topPx, fold]
            properties:
              position:
                type: integer
                minimum: 1
                maximum: 100
                description: 1-based order among the organic results of this page, without gaps.
              url:
                $ref: '#/components/schemas/HttpUrl'
                description: Where the result leads, with Google's redirect and tracking parameters removed.
              domain:
                type: string
                maxLength: 255
                description: Host of url, in lower case, without a leading "www." (other subdomains are kept).
              title:
                type: string
                minLength: 1
                maxLength: 400
                description: The result's title as shown on the page.
              topPx:
                type: [integer, 'null']
                minimum: 0
                maximum: 10000000
                description: Top edge of the result. null when it could not be measured.
              fold:
                $ref: '#/components/schemas/Fold'
                description: Fold position of the result, with the same three values as firstOrganicFold. null exactly when topPx is null.
        tracked:
          type: array
          maxItems: 250
          description: >-
            Every brand the user tracks in the extension, their own and competitors: brands found among the
            organic results first, in result order, then the brands that were not found. The names come from
            the extension's settings (typed by the user, or pre-filled from Business Details). They are labels,
            not ids, and need not match the competitors stored for the business.
          items:
            type: object
            required: [owner, name, position, topPx, fold]
            properties:
              owner:
                type: string
                enum: [mine, competitor]
                description: mine is one of the user's own brands, competitor one of their competitors.
              name:
                type: string
                minLength: 1
                maxLength: 160
                description: The brand's display name. When the user gave it no name, its first domain, or else its first other spelling.
              position:
                type: [integer, 'null']
                minimum: 1
                maximum: 100
                description: >-
                  organic[].position of the brand's first organic result on this page. null means the brand has
                  no organic result on this page. A brand matches a result by domain, never by its name.
              topPx:
                type: [integer, 'null']
                minimum: 0
                maximum: 10000000
                description: Top edge of that result. null when position is null or the result could not be measured.
              fold:
                $ref: '#/components/schemas/Fold'
                description: Fold position of that result. null when topPx is null.
    GapList:
      type: object
      description: >-
        A "Why Not Me" gap list: the places on one source where tracked competitors appear and the user's own
        brand does not. It is computed in the extension against the brands tracked there.
      required: [source, subject, capturedAt, rows]
      properties:
        source:
          type: string
          minLength: 1
          maxLength: 40
          description: >-
            Where the list was read from, as a label. An AI Overview shown on a results page belongs to
            "Google results". Store it as text and accept labels you do not know.
          x-examples: [Google results, Google AI Mode, ChatGPT, Gemini, Perplexity, Copilot, Pasted answer]
        subject:
          type: string
          maxLength: 4000
          description: >-
            The Google query, or the question the user asked on the AI site. It can be an empty string: always
            for "Pasted answer", and whenever no question could be read. Do not require it and do not use it
            as a unique key.
        capturedAt:
          type: string
          format: date-time
          description: >-
            When the page or answer was read, on the user's clock, as UTC with milliseconds. It is not the time
            of the save and it is not unique: saving the same reading before and after "Scan sources" sends the
            same value with different rows.
        rows:
          type: array
          minItems: 1
          maxItems: 1000
          description: >-
            One row per gap, in the order shown to the user (highest priority first unless they re-sorted).
          items:
            type: object
            required: [surfaceId, surface, position, title, url, domain, competitors, evidence, pageType, actionable, scanned, contacts]
            properties:
              surfaceId:
                type: string
                maxLength: 40
                x-values: [ai_overview, organic, local_pack, forum, video, ad, featured_snippet, top_stories, shopping, answer_text, citations, scanned_page]
                description: >-
                  Where the gap is, as a code. answer_text and citations belong to the answers of ChatGPT,
                  Gemini, Perplexity, Copilot and to pasted text. ai_overview is Google's own AI answer: the
                  AI Overview on a results page, and the whole answer of Google AI Mode. The others are blocks
                  of a Google results page. scanned_page is a cited or list-style page that was found to be
                  a gap only when "Scan sources" read it; `surface` says where it was linked from.
              surface:
                type: string
                minLength: 1
                maxLength: 60
                description: The same place as a label for people. Use surfaceId and position in code, not this text, except to tell where a "scanned_page" row was linked from.
                x-examples: ['Organic #3', AI Overview citation, Answer text, Cited by ChatGPT]
              position:
                type: [integer, 'null']
                minimum: 1
                maximum: 1000
                description: >-
                  1-based position inside its own surface on the page the user had open: the organic position,
                  the order of the citation, the order of the item in its block. For surfaceId "scanned_page"
                  it is the position where the page was linked from. null exactly when pageType is "surface".
                  It is not an absolute Google rank.
              title:
                type: string
                maxLength: 1000
                description: >-
                  Title of the page or item. For pageType "surface" it is a sentence written by the extension.
                  Can be empty for an ad without a readable headline.
              url:
                oneOf:
                  - $ref: '#/components/schemas/HttpUrl'
                  - type: 'null'
                description: >-
                  URL of the page the row is about, with tracking parameters removed. null for pageType
                  "surface", and for some local-pack and ad rows that have no link.
              domain:
                type: [string, 'null']
                maxLength: 255
                description: Host of url, in lower case, without a leading "www.". null exactly when url is null.
              competitors:
                type: array
                minItems: 1
                maxItems: 200
                description: >-
                  Display names of the tracked competitors found here, from the extension's own list (a
                  competitor without a name is listed by its first domain). They are not ids and may not match
                  the competitors stored for the business. Store them as text.
                items: { type: string, minLength: 1, maxLength: 160 }
              evidence:
                type: string
                minLength: 1
                maxLength: 2000
                description: >-
                  One English sentence, written by the extension, that says why the row is a gap. Show it;
                  do not parse it.
              pageType:
                type: string
                maxLength: 40
                x-values: [competitor-site, list, forum, video, third-party, surface]
                description: >-
                  Kind of thing the row points at. surface: the wording of the surface itself (no page).
                  competitor-site: a page on a tracked competitor's own domain. list: a list-style page such as
                  "10 best…". forum, video: results of those blocks. third-party: any other page.
              actionable:
                type: boolean
                description: >-
                  true when the row is a page on another site, and the business could ask to be included
                  there: not a competitor's own site, not an ad, not a local-pack listing. Store it as sent;
                  it cannot be derived from pageType.
              scanned:
                type: boolean
                description: >-
                  true when "Scan sources" fetched and read the page. title, competitors, evidence, pageType and
                  contacts then describe the fetched page.
              contacts:
                type: array
                maxItems: 18
                description: >-
                  Ways to contact the people who run the page, found on the scanned page. Empty unless scanned
                  is true. These are names, URLs and e-mail addresses read from third-party pages: handle them
                  as personal data.
                items:
                  type: object
                  required: [kind, label, url]
                  properties:
                    kind:
                      type: string
                      maxLength: 40
                      x-values: [contact, author, submission]
                      description: >-
                        contact: a contact, about or team page, or an e-mail link. author: the author's page, or
                        the line that names the author. submission: a "submit", "write for us", "get listed" or
                        "advertise" link.
                    label:
                      type: string
                      minLength: 1
                      maxLength: 300
                      description: Text to show for the link.
                    url:
                      type: string
                      maxLength: 2048
                      pattern: '^(https?://|mailto:)'
                      description: >-
                        An absolute http or https URL, or "mailto:" followed by an e-mail address. Show
                        mailto values as e-mail links; never request them.
    Competitor:
      type: object
      description: >-
        A competitor as the user tracks it in the extension. The same shape is used when one is added to
        a business, listed in a brief, and returned in Business Details.
      required: [name, domains]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
          description: Display name, as the user typed it. "Acme" and "ACME" are the same name.
        domains:
          type: array
          maxItems: 30
          description: >-
            The competitor's sites as host names: lower case, no "www.", no path. Can be empty when the
            competitor is tracked by name only. A value is any text the user typed that can be read as a
            host: it can be a subdomain, and it is not checked against a list of public suffixes.
          items: { type: string, minLength: 1, maxLength: 255 }
    ContentEditorDocument:
      type: object
      description: >-
        The result of comparing one text with competing pages, sentence by sentence. Two sentences "make
        the same point" when their similarity reaches method.threshold. The text itself is not sent:
        only its sentences that nobody else makes, and the points it lacks.
      required: [targetKeyword, source, pageUrl, pageTitle, capturedAt, method, wordShare, onlyHere, missingPoints, comparedUrls]
      properties:
        targetKeyword:
          type: string
          maxLength: 500
          description: >-
            A free-text label from the "Target keyword" box. The user can type a search phrase; when they
            do not, it is pre-filled with the first part of the page title, so it is often a headline.
            Can be an empty string. Do not use it as a key.
        source:
          type: string
          maxLength: 40
          x-values: [page, selection, pasted]
          description: >-
            What was checked. page: the main content of the page at pageUrl. selection: only the text the
            user had selected on that page. pasted: text the user pasted into the extension; there is no page.
        pageUrl:
          oneOf:
            - $ref: '#/components/schemas/HttpUrl'
            - type: 'null'
          description: >-
            URL of the page, as open in the user's browser (query string and fragment included). null
            exactly when source is "pasted".
        pageTitle:
          type: string
          maxLength: 500
          description: Title of the page. An empty string when source is "pasted" or the page has no title.
        capturedAt:
          type: string
          format: date-time
          description: >-
            When the comparison was made, on the user's clock, as UTC with milliseconds. It is not the time
            of the save, and it is the same when the same comparison is sent again.
        method:
          type: object
          description: How the comparison was made, so that two documents can be compared fairly.
          required: [engine, threshold, pagesCompared]
          properties:
            engine:
              type: string
              maxLength: 40
              x-values: [embedding, lexical]
              description: >-
                embedding: sentence meanings compared with a language model that runs in the browser (the
                normal case). lexical: sentences compared by the words they share, used when that model
                cannot run; it does not find two sentences that say the same thing in different words.
            threshold:
              type: number
              minimum: 0
              maximum: 1
              description: >-
                Similarity (0 to 1) from which two sentences count as making the same point. In this
                version 0.72 for embedding and 0.5 for lexical.
            pagesCompared:
              type: integer
              minimum: 1
              maximum: 8
              description: >-
                How many competing pages the text was compared with. Always the number of comparedUrls.
                "Most" below means more than half of this number.
        wordShare:
          type: object
          description: >-
            How the words of the checked text divide by how common their sentence is: fractions of 1 (not
            percentages), counted in words (not sentences), rounded to 4 decimals. The three add up to 1
            within rounding.
          required: [saidByMost, saidBySome, onlyHere]
          properties:
            saidByMost: { type: number, minimum: 0, maximum: 1, description: In sentences that more than half of the compared pages also make. }
            saidBySome: { type: number, minimum: 0, maximum: 1, description: 'In sentences that at least one compared page makes, but not more than half. Always 0 when one page was compared.' }
            onlyHere: { type: number, minimum: 0, maximum: 1, description: In sentences that no compared page makes. The sentences themselves are in the onlyHere list. }
        onlyHere:
          type: array
          maxItems: 200
          description: >-
            The sentences of the checked text that no compared page makes, in the order they appear. This
            is what is new in the text. Empty when every sentence has a match. Sentences shorter than five
            words are never checked.
          items: { type: string, minLength: 1, maxLength: 600 }
        missingPoints:
          type: array
          maxItems: 12
          description: >-
            Points that more than half of the compared pages make and the checked text does not. The
            point that the most pages make comes first. Points that are almost the same are merged into
            one. Always empty when fewer than two pages were compared.
          items:
            type: object
            required: [text, pages, urls]
            properties:
              text: { type: string, minLength: 1, maxLength: 600, description: 'One sentence that makes the point, quoted from one of the pages in urls.' }
              pages: { type: integer, minimum: 2, maximum: 8, description: How many compared pages make the point. Always the number of urls. }
              urls:
                type: array
                minItems: 2
                maxItems: 8
                description: The compared pages that make the point. Each one is also in comparedUrls.
                items: { $ref: '#/components/schemas/HttpUrl' }
        comparedUrls:
          type: array
          minItems: 1
          maxItems: 8
          description: >-
            The competing pages the text was compared with, in comparison order: the URLs that were
            requested, before any redirect. Pages that could not be read or had no text are left out.
          items: { $ref: '#/components/schemas/HttpUrl' }
    WorkspaceFromBrief:
      type: object
      description: >-
        A client brief the extension wrote from a business's public website (it reads up to 8 pages of the
        site). Nothing in it was typed or confirmed by the user except the list of competitors. Every list
        except avatars can be empty: the extension sends what it found.
      required: [briefId, businessName, siteUrl, createdAt, contact, serviceAreas, services, competitors, focusKeywords, avatars, issues, nextSteps, markdown]
      properties:
        briefId:
          type: string
          minLength: 1
          maxLength: 64
          description: >-
            The extension's own id of the brief, random and unique on the user's device only: look it up
            per user, never across users. The same brief sent again (after the user edited its competitors,
            or days later from "Saved briefs") carries the same briefId and the same createdAt.
          x-examples: [brief_3f9c2a7d41b06e58aa]
        businessName:
          type: string
          minLength: 1
          maxLength: 160
          description: >-
            Name of the business as read from its site: structured data, the site-name tag, or the part of
            the page titles that repeats. When none is found it is the host name without "www."
            ("brightpathdental.example"), so a name equal to the host of siteUrl means "no name found".
        siteUrl:
          $ref: '#/components/schemas/HttpUrl'
          description: The site the brief is about, as its origin with a trailing slash and nothing after it (https://www.example.com/).
        createdAt:
          type: string
          format: date-time
          description: >-
            When the brief was built on the user's device, on the user's clock, as UTC with milliseconds. It
            is not the time of the save and can be days in the past. Record your own time of receipt.
        contact:
          type: object
          description: >-
            Contact details the business publishes on its own site. Text as published: store and show it,
            do not validate or normalise it.
          required: [phones, emails, addresses]
          properties:
            phones:
              type: array
              maxItems: 6
              description: Phone numbers the way the site writes them. An entry can be the text of a phone link, such as "Call (512) 555-0142".
              items: { type: string, minLength: 1, maxLength: 60 }
            emails:
              type: array
              maxItems: 6
              description: E-mail addresses in the site's own letter case. A link with several recipients arrives as one comma-separated entry.
              items: { type: string, minLength: 1, maxLength: 320 }
            addresses:
              type: array
              maxItems: 4
              description: Postal addresses, each on one line.
              items: { type: string, minLength: 1, maxLength: 240 }
        serviceAreas:
          type: array
          maxItems: 16
          description: Places the business says it serves, in the site's wording.
          items: { type: string, minLength: 1, maxLength: 80 }
        services:
          type: array
          maxItems: 20
          description: Services or products named on the site, in the site's wording.
          items: { type: string, minLength: 1, maxLength: 120 }
        competitors:
          type: array
          maxItems: 200
          description: >-
            The competitors the user ticked for this brief: ones they track in the extension, ones they
            typed, and sites picked from an open Google results page. Names are labels, not ids. No two
            entries share a name or a domain. Each entry carries at most one domain here: the competitor's
            first one, or the host of the result it was picked from, which is then also its name.
          items: { $ref: '#/components/schemas/Competitor' }
        focusKeywords:
          type: array
          maxItems: 30
          description: >-
            Search phrases suggested by the site's own page titles and headings, in lower case. The
            phrases found on the most pages come first, approximately. They are candidates: nobody
            researched or confirmed them.
          items: { type: string, minLength: 1, maxLength: 200 }
        avatars:
          type: array
          minItems: 3
          maxItems: 3
          description: >-
            Exactly three draft customer avatars, written from the site's content by a template or, when the
            user asked for it, by AI. The body does not say which.
          items:
            type: object
            required: [name, description, draft]
            properties:
              name: { type: string, minLength: 1, maxLength: 160, description: Short label of the avatar. }
              description:
                type: string
                minLength: 1
                maxLength: 2000
                description: 'One paragraph in a fixed form: who they are, then "Wants:" and what they want, then "Worries about:" and what they worry about.'
              draft: { type: boolean, const: true, description: Always true. Show the avatar as a draft for the user to review. }
        issues:
          type: array
          maxItems: 20
          description: >-
            Basic on-page SEO findings for the pages that were read, most severe first. At most one entry
            per kind of finding.
          items:
            type: object
            required: [code, severity, title, detail, pages]
            properties:
              code:
                type: string
                minLength: 1
                maxLength: 40
                x-values: [not-https, noindex, missing-title, duplicate-title, short-title, long-title, missing-description, missing-h1, multiple-h1, canonical-elsewhere, missing-canonical, missing-viewport, missing-alt, no-structured-data, thin-content]
                description: The kind of finding. Use this, not the title, to recognise a finding.
              severity: { type: string, enum: [high, medium, low], description: How much the finding matters for search. Fixed per code. }
              title: { type: string, minLength: 1, maxLength: 300, description: 'The finding in a few English words, for display ("Missing meta description").' }
              detail: { type: string, maxLength: 2000, description: One English sentence that names the affected pages by path. For display. }
              pages:
                type: array
                minItems: 1
                maxItems: 8
                description: URLs of the pages the finding applies to, as they were read (after redirects; the open page with its query string).
                items: { $ref: '#/components/schemas/HttpUrl' }
        nextSteps:
          type: array
          maxItems: 8
          description: >-
            Recommended first actions, most important first: one or two English sentences each, written by
            a template or, when the user asked for it, by AI. They can quote a keyword the user searched for.
          items: { type: string, minLength: 1, maxLength: 600 }
        markdown:
          type: string
          minLength: 1
          maxLength: 200000
          description: >-
            The whole brief as one Markdown document (CommonMark: headings, paragraphs, emphasis and bullet
            lists), the same text the user can export. It holds more than the fields above: the search
            findings, the site's tone of voice and testimonials, and "Prepared by" with the agency's name when the
            user set one. Store it and show it as the brief; do not parse it. It quotes web pages: render
            it with raw HTML and unsafe links switched off. A column for it must hold 600 KB: the limit
            of 200,000 is counted in UTF-16 code units, and one unit is up to 3 bytes of UTF-8. A MySQL
            TEXT column ends at 64 KB and is too small. The Markdown repeats the contact details and
            quotes the site's testimonials with the names of its customers.
    IndustryPulse:
      type: object
      required: [events]
      properties:
        updatedAt:
          type: [string, 'null']
          description: >-
            When the list was last edited, as text. A date and time in UTC is best, for example
            2026-11-18T09:00:00Z. The extension does not show it and does not check its form.
        events:
          type: array
          description: The events, newest first. A JSON array, also when it is empty. The extension shows the first 8 that have a valid date.
          x-uses: { items: 8 }
          items:
            type: object
            required: [date, title]
            properties:
              date:
                type: string
                format: date
                description: >-
                  The calendar day of the event as the text YYYY-MM-DD (zero-padded). For a rollout, the day
                  it started. Not a timestamp and not a number. An event whose date is not a real day is
                  skipped.
              title:
                type: string
                minLength: 1
                description: What happened. Shown as the tooltip of the date.
                x-uses: { chars: 300 }
              type:
                type: [string, 'null']
                description: Kind of event. Not used by the extension yet; any text is accepted.
                x-examples: [algorithm-update, serp-feature, news]
              url:
                type: [string, 'null']
                description: A page that describes the event. Not shown yet.
    AiCompletionRequest:
      type: object
      required: [task, system, prompt, maxOutputTokens]
      properties:
        task:
          type: string
          maxLength: 40
          x-values: [click-potential, why-not-me, rewind, new-or-noise, brief]
          description: Which screen asked. Use it to count requests per feature, and in your logs. What you must return depends on responseSchema, not on this.
        system:
          type: string
          minLength: 1
          maxLength: 2000
          description: The system prompt. The same fixed English text for every request of one extension version.
        prompt:
          type: string
          minLength: 1
          maxLength: 10000
          description: >-
            The user message: a line "Task: …", a line that says which format to reply in, then the facts as
            "- " lines between `<facts>` and `</facts>`. The facts were read from web pages: all of this text is
            untrusted input for your model. Do not parse it.
        responseSchema:
          type: object
          description: >-
            Left out (never null) for a summary. Present when a JSON document is wanted, which in this
            version is the "brief" task: a JSON Schema that uses only type, properties, required, items,
            minItems, maxItems and additionalProperties. `text` must then be one JSON document that
            matches it.
        maxOutputTokens:
          type: integer
          minimum: 1
          maximum: 4000
          description: >-
            The largest size of the visible reply, in model tokens: 700 for a summary, 2,000 when
            responseSchema is present. Above your own maximum, use your maximum.
    AiCompletionResponse:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          description: >-
            What the model wrote, always as a string. For a summary: plain text, one point per line. With
            a responseSchema: the JSON document serialised into this string, with nothing before or
            after it.
          x-uses: { chars: 20000 }
        model:
          type: [string, 'null']
          description: Name of the model that wrote it. Not shown yet.
          x-uses: { chars: 120 }
